openapi: 3.1.0
info:
  title: HarmonyOS Input AI Proxy Contract
  version: 0.1.0-draft
  description: Draft contract. No production endpoint or compliance approval is implied.
servers: []
paths:
  /v1/ime/suggestions:
    post:
      operationId: createImeSuggestions
      security:
        - shortLivedAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionRequest'
      responses:
        '200':
          description: Validated plain-text suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionResponse'
        '400': { $ref: '#/components/responses/FixedError' }
        '401': { $ref: '#/components/responses/FixedError' }
        '404': { $ref: '#/components/responses/FixedError' }
        '409': { $ref: '#/components/responses/FixedError' }
        '413': { $ref: '#/components/responses/FixedError' }
        '415': { $ref: '#/components/responses/FixedError' }
        '429': { $ref: '#/components/responses/FixedError' }
        '500': { $ref: '#/components/responses/FixedError' }
        '502': { $ref: '#/components/responses/FixedError' }
        '503': { $ref: '#/components/responses/FixedError' }
        '504': { $ref: '#/components/responses/FixedError' }
components:
  securitySchemes:
    shortLivedAccessToken:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT (at+jwt, lifetime <= 300 seconds)
  responses:
    FixedError:
      description: A fixed, sanitized error code with no provider detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuggestionRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, requestId, action, text, language, maxSuggestions]
      properties:
        protocolVersion: { type: string, minLength: 1, maxLength: 32 }
        requestId: { type: string, pattern: '^[A-Za-z0-9._:-]{8,96}$' }
        action:
          type: string
          enum: [continue, concise, polite, formal, translate]
        text: { type: string, minLength: 1, maxLength: 1024 }
        language: { type: string, minLength: 2, maxLength: 16 }
        maxSuggestions: { type: integer, minimum: 1, maximum: 3 }
    SuggestionResponse:
      type: object
      additionalProperties: false
      required: [protocolVersion, requestId, providerType, providerVersion, suggestions]
      properties:
        protocolVersion: { type: string }
        requestId: { type: string }
        providerType: { const: cloud }
        providerVersion: { type: string, minLength: 1, maxLength: 64 }
        suggestions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [suggestionId, text, label, type]
            properties:
              suggestionId: { type: string }
              text: { type: string, minLength: 1, maxLength: 512 }
              label: { type: string, maxLength: 32 }
              type: { const: text }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - invalid_request
                - payload_too_large
                - duplicate_request
                - rate_limited
                - provider_unavailable
                - provider_timeout
                - provider_response_invalid
                - provider_response_too_large
                - internal_error
